<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="My Campus Notes Library - Organize and manage your campus PDF notes with Google Drive integration">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json?v=10">
    <link rel="icon" href="icons/new-icon-192.png">
    <link rel="apple-touch-icon" href="icons/new-icon-apple.png">
    <title>My Campus Notes Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button id="menu-toggle" type="button" class="icon-btn menu-btn" aria-label="Toggle Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="logo">
                    <img src="icons/new-icon-192.png" alt="Logo" class="logo-img">
                    <span class="logo-text">Note Library</span>
                </div>

                <!-- User Selector -->
                <div class="user-selector-container">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <select id="user-selector" class="user-selector">
                        <option value="Me">Me</option>
                    </select>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                    <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <div class="user-auth-container">
                    <button id="sign-in-btn" class="user-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        <span>Sign In</span>
                    </button>

                    <div id="user-profile" class="user-profile" style="display: none;">
                        <img id="user-avatar" src="" alt="User" class="user-avatar">
                        <span id="user-name-display" class="user-name-display"></span>
                        <button id="sign-out-btn" class="sign-out-icon-btn" title="Sign Out">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Subjects</h2>
                <button id="manage-subjects-btn" class="icon-btn-small" aria-label="Manage subjects"
                    title="Add/Remove Subjects">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
                <button id="trash-btn" class="icon-btn-small" aria-label="View Trash" title="Recycle Bin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <!-- Lid and Handle -->
                        <path d="M3 6h18"></path>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <!-- Bin Body -->
                        <path d="M19 6l-2 14H7L5 6"></path>
                        <!-- Recycle Symbol (Triangle) -->
                        <path d="M12 11l-3 4h6l-3-4z"></path>
                    </svg>
                </button>
            </div>
            <nav id="sidebar-nav-container" class="sidebar-nav">
                <!-- Navigation items will be dynamically inserted here -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search and Upload Section -->
            <div class="controls-section">
                <div class="search-container">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search notes by name..." class="search-input">
                </div>
                <div class="sort-container">
                    <select id="sort-select" class="sort-select" aria-label="Sort notes">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="size-desc">Size (Large-Small)</option>
                        <option value="size-asc">Size (Small-Large)</option>
                    </select>
                </div>
                <button id="upload-btn" class="upload-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Upload PDF
                </button>
            </div>

            <!-- Drop Zone -->
            <div id="drop-zone" class="drop-zone">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h3>Drag & Drop PDF Files Here</h3>
                <p>or click the Upload PDF button</p>
            </div>

            <!-- Subject Selector for Upload -->
            <div id="subject-selector" class="subject-selector" style="display: none;">
                <h3>Select Subject for Upload</h3>
                <div class="subject-buttons">
                    <button class="subject-btn" data-subject="Programming">Programming</button>
                    <button class="subject-btn" data-subject="Mathematics">Mathematics</button>
                    <button class="subject-btn" data-subject="Database">Database</button>
                    <button class="subject-btn" data-subject="Networks">Networks</button>
                    <button class="subject-btn" data-subject="Algorithms">Algorithms</button>
                </div>
                <button id="cancel-upload" class="cancel-btn">Cancel</button>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading notes...</p>
            </div>

            <!-- Notes Grid -->
            <div id="notes-grid" class="notes-grid">
                <!-- PDF cards will be dynamically inserted here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
                <h2>No notes found</h2>
                <p>Upload your first PDF to get started!</p>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Manage Subjects Modal -->
    <div id="manage-subjects-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Subjects</h2>
                <button id="close-modal-btn" class="icon-btn-small">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="add-subject-form">
                    <input type="text" id="new-subject-input" placeholder="Enter new subject name">
                    <button id="add-subject-btn" class="primary-btn">Add</button>
                </div>
                <div id="subjects-list" class="subjects-list">
                    <!-- Subjects list will be populated dynamically -->
                </div>
            </div>
        </div>
    </div>



    <!-- Trash Modal -->
    <div id="trash-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Recycle Bin</h2>
                <button id="close-trash-btn" class="icon-btn-small">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="trash-list-container">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>
    <!-- PDF Preview Modal -->
    <div id="pdf-modal" class="modal" style="display: none;">
        <div class="modal-content modal-fullscreen">
            <div class="modal-header">
                <h2 id="pdf-modal-title" class="truncate">Document Preview</h2>
                <button id="close-pdf-btn" class="icon-btn-small" aria-label="Close Preview">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body pdf-body">
                <iframe id="pdf-frame" src="" frameborder="0" width="100%" height="100%"></iframe>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <!-- App Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
    <script src="js/drive.js"></script>
    <script src="js/ui.js"></script>

    <!-- PWA Support -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker Registered'))
                    .catch(err => console.log('❌ SW Registration Failed:', err));
            });
        }
    </script>
</body>

</html>
